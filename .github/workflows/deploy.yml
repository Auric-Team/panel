name: Auto Deploy to VPS`n`non:`n  push:`n    branches:`n      - main`n`njobs:`n  deploy:`n    runs-on: ubuntu-latest`n`n    steps:`n      - name: Deploy to VPS`n        uses: appleboy/ssh-action@v1.0.3`n        with:`n          host: `${{ secrets.VPS_HOST }}`n          username: `${{ secrets.VPS_USERNAME }}`n          key: `${{ secrets.VPS_SSH_KEY }}`n          script: |`n            export BUN_INSTALL="`$HOME/.bun"`n            export PATH="`$BUN_INSTALL/bin:`$PATH"`n`n            # Pull latest changes including .env`n            cd /root/panel`n            git reset --hard origin/main`n            git pull origin main`n`n            # Build and Restart Backend`n            cd /root/panel/backend`n            bun install`n            bun run build`n            pm2 restart axios-backend || pm2 start dist/index.js --name "axios-backend"`n`n            # Build and Restart Frontend`n            cd /root/panel/frontend`n            bun install`n            bun run build`n            pm2 restart axios-frontend || pm2 start "bun run start" --name "axios-frontend"`n`n            pm2 save
